[workspace]
members = [
  "crates/protocol",
  "crates/crypto-core",
  "crates/mls-session",
  "crates/registration",
  "crates/key-directory",
  "crates/relay",
  "services/gateway",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
axum = "=0.8.9"
base64 = { version = "=0.23.0", default-features = false, features = ["std"] }
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
openmls = { version = "=0.8.1", default-features = false }
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zeroize = "=1.9.0"
